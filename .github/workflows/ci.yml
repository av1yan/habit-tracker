name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The tests use the built-in node:sqlite module, which requires Node >= 22.5.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (backend / shared library)
        run: npm run typecheck

      - name: Typecheck (Expo app)
        run: npm run typecheck:app

      - name: Tests
        run: npm test
